  <script>
    (function () {
      const isAuthenticated = {{ 'true' if current_user.is_authenticated else 'false' }};
      if (!isAuthenticated) return;

      const timeoutSeconds = Number('{{ config.get("SESSION_IDLE_TIMEOUT_SECONDS", 3600) }}') || 3600;
      let idleTimer;

      const resetTimer = () => {
        if (idleTimer) clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
         // window.location.replace('{{ url_for("auth.logout") }}');
        }, timeoutSeconds * 1000);
      };

      ['mousemove', 'keydown', 'mousedown', 'touchstart', 'scroll', 'click'].forEach((eventName) => {
        document.addEventListener(eventName, resetTimer, { passive: true });
      });

      resetTimer();
    })();
  </script>

<body class="m-0 overflow-x-hidden">

  <!-- Main Content Area (full width — no sidebar offset) -->
  <main id="main-content" class="min-h-screen flex flex-col">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/pwa.js') }}?v=pwa-htmx-1"></script>

  <!-- Flash Messages as Toast Notifications -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <script>
        document.addEventListener('DOMContentLoaded', function () {
          {% for category, message in messages %}
            if (window.toast && typeof window.toast.show === 'function') {
              window.toast.show({{ message|tojson }}, {{ category|tojson }});
            }
          {% endfor %}
        });
      </script>
    {% endif %}
  {% endwith %}
